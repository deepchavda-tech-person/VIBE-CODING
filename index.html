<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Glass Clock</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#00111f,#0000ff,#ff9500,#001d3d);
background-size:400% 400%;
animation:bg 12s infinite alternate;
}

@keyframes bg{

0%{background-position:left;}
100%{background-position:right;}

}

body::before{

content:"";
position:absolute;
width:450px;
height:450px;
background:#f9ba33;
filter:blur(180px);
opacity:.30;
left:-120px;
top:-100px;

}

body::after{

content:"";
position:absolute;
width:400px;
height:400px;
background:#ff00ff;
filter:blur(180px);
opacity:.25;
right:-120px;
bottom:-120px;

}

.clock{

position:relative;
z-index:2;

width:450px;

padding:40px;

text-align:center;

background:rgba(253, 251, 251, 0.06);

border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(30px);

-webkit-backdrop-filter:blur(30px);

border-radius:30px;

box-shadow:
0 0 30px rgba(247, 245, 245, 0.08),
0 0 80px rgba(250, 251, 250, 0.15);

}

.title{

color:rgb(0, 0, 0);
font-size:30px;
letter-spacing:4px;
margin-bottom:25px;

}

#time{

font-size:70px;
font-weight:bold;
color:rgb(0, 0, 0);
letter-spacing:3px;
text-shadow:
0 0 10px rgb(11, 11, 11),
0 0 20px rgb(6, 6, 6),
0 0 40px rgb(8, 8, 8);

}

#ampm{

font-size:24px;
margin-top:10px;
color:#080808;

}

.line{

width:100%;
height:1px;
background:rgba(2, 2, 2, 0.2);
margin:25px 0;

}

#date{

font-size:22px;
color:rgb(8, 8, 8);
letter-spacing:2px;

}

.footer{

margin-top:20px;
font-size:15px;
color:rgba(7, 7, 7, 0.7);

}

@media(max-width:500px){

.clock{
width:95%;
padding:25px;
}

#time{
font-size:48px;
}

.title{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="clock">

<div class="title">
SMART DIGITAL CLOCK
</div>

<div id="time">
00:00:00
</div>

<div id="ampm">
AM
</div>

<div class="line"></div>

<div id="date"></div>

<div class="footer">

</div>

</div>

<script>

function updateClock(){

const now=new Date();

let h=now.getHours();
let m=now.getMinutes();
let s=now.getSeconds();

let ampm=h>=12?"PM":"AM";

h=h%12;
if(h==0)h=12;

h=String(h).padStart(2,"0");
m=String(m).padStart(2,"0");
s=String(s).padStart(2,"0");

document.getElementById("time").innerHTML=
`${h}:${m}:${s}`;

document.getElementById("ampm").innerHTML=ampm;

const option={

weekday:"long",
day:"numeric",
month:"long",
year:"numeric"

};

document.getElementById("date").innerHTML=
now.toLocaleDateString("en-US",option);

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
